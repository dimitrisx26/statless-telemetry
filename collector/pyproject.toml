[project]
name = "statless-telemetry-collector"
version = "0.1.0"
description = "Self-hostable, cookie-free usage telemetry collector for developer CLIs and npm packages."
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "statless-telemetry contributors" }]
keywords = ["telemetry", "analytics", "privacy", "selfhosted", "fastapi", "cli", "npm"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
statless-telemetry = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "RET", "ASYNC"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
